name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Build from committed data (if present)
        run: |
          if [ -f data/derived/site.json ]; then node src/site/build.ts && node scripts/scan-secrets.ts dist data; else echo "no data yet"; fi
