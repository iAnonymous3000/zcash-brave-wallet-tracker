name: probe-sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public sources from runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UA='zcash-brave-wallet-tracker-probe (+https://github.com/${{ github.repository }})'
          probe() {
            echo "=== $1"
            curl -sS -L -A "$UA" -o /tmp/body -D /tmp/hdr -w 'status=%{http_code} type=%{content_type} final=%{url_effective} time=%{time_total}\n' "$1" || echo "curl-failed"
            grep -i -E '^(server|cf-ray|cf-mitigated|retry-after|x-ratelimit)' /tmp/hdr | tr -d '\r' || true
            head -c 200 /tmp/body | tr -d '\n'; echo
          }
          probe 'https://community.brave.app/categories.json'
          probe 'https://community.brave.app/search.json?q=zcash'
          probe 'https://community.brave.com/search.json?q=zcash'
          probe 'https://support.brave.com/api/v2/help_center/en-us/articles/search.json?query=zcash'
          probe 'https://support.brave.com/hc/en-us/categories/360001062531-Wallet'
          probe 'https://brave.com/latest/'
          probe 'https://brave.com/wallet/'
          probe 'https://brave.com/blog/'
          probe 'https://crates.io/api/v1/crates/orchard'
          probe 'https://raw.githubusercontent.com/brave/brave-browser/master/CHANGELOG_DESKTOP.md'
          probe 'https://zips.z.cash/'
          echo "=== GitHub REST rate limit (GITHUB_TOKEN)"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/rate_limit | head -c 1500; echo
          echo "=== GitHub search"
          curl -sS -D /tmp/h2 -o /tmp/b2 -H "Authorization: Bearer $GH_TOKEN" 'https://api.github.com/search/issues?q=repo:brave/brave-browser+zcash&per_page=1'
          grep -i x-ratelimit /tmp/h2; head -c 120 /tmp/b2; echo
          echo "=== GitHub GraphQL"
          curl -sS -D /tmp/h3 -o /tmp/b3 -H "Authorization: Bearer $GH_TOKEN" -X POST https://api.github.com/graphql \
            -d '{"query":"{ rateLimit { limit remaining cost resetAt } repository(owner:\"brave\",name:\"brave-browser\"){ issue(number:56872){ title state stateReason } } }"}'
          grep -i x-ratelimit /tmp/h3; cat /tmp/b3; echo
          echo "=== GitHub advisories"
          curl -sS -o /tmp/b4 -w 'status=%{http_code}\n' -H "Authorization: Bearer $GH_TOKEN" 'https://api.github.com/advisories?ecosystem=rust&affects=orchard'
          head -c 200 /tmp/b4; echo
